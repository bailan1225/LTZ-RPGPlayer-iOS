<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LTZ RPG Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e; 
      color: #eee; 
      min-height: 100vh;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    header { text-align: center; padding: 30px 0; border-bottom: 1px solid #333; margin-bottom: 20px; }
    header h1 { font-size: 2.5em; color: #e94560; margin-bottom: 10px; }
    .subtitle { color: #888; font-size: 1.1em; }
    .input-section { background: #16213e; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .input-section label { display: block; margin-bottom: 10px; color: #aaa; }
    .input-section input { 
      width: 100%; padding: 12px 16px; border: 2px solid #333; border-radius: 8px;
      background: #0f0f23; color: #fff; font-size: 16px; margin-bottom: 12px;
    }
    .input-section button { 
      width: 100%; padding: 14px; background: #e94560; color: #fff; border: none;
      border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;
    }
    .game-frame { width: 100%; height: 70vh; border: none; background: #000; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 LTZ RPG Player</h1>
      <p class="subtitle">RPG Maker MV/MZ 游戏播放器</p>
    </header>
    <main>
      <div class="input-section">
        <label for="gameUrl">游戏地址:</label>
        <input type="text" id="gameUrl" placeholder="输入 RPG Maker MV/MZ 游戏路径...">
        <button id="loadBtn">加载游戏</button>
      </div>
      <iframe id="gameFrame" class="game-frame" sandbox="allow-scripts allow-same-origin"></iframe>
    </main>
  </div>
  <script>
    document.getElementById('loadBtn').addEventListener('click', function() {
      var url = document.getElementById('gameUrl').value.trim();
      if (url) {
        document.getElementById('gameFrame').src = url;
      }
    });
    document.getElementById('gameUrl').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') document.getElementById('loadBtn').click();
    });
  </script>
</body>
</html>
