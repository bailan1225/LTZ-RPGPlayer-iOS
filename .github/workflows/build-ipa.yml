name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Dependencies
        run: npm install
      
      - name: Add iOS Platform
        run: npx cap add ios
      
      - name: Sync iOS
        run: npx cap sync ios
      
      - name: Build Archive
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/App.xcarchive \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""
      
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          cd ios/App/build
          zip -r ../../ltz-rpg.ipa Payload
          rm -rf Payload
          ls -la ../../ltz-rpg.ipa
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LTZ-RPG-IPA
          path: ios/App/ltz-rpg.ipa
          retention-days: 7
