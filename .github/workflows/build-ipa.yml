name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: |
          ls /Applications/ | grep -i xcode
          sudo xcode-select -switch /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -switch /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version
          swift --version
      
      - name: Check Project
        run: |
          echo "=== Files ==="
          find . -name "*.swift"
          echo ""
          echo "=== Xcode Project ==="
          ls *.xcodeproj
          echo ""
          echo "=== Scheme ==="
          ls MyRPG.xcodeproj/xcshareddata/xcschemes/ 2>/dev/null || ls *.xcodeproj/xcshareddata/xcschemes/ 2>/dev/null || echo "No schemes found"
          echo ""
          echo "=== project.pbxproj ==="
          cat *.xcodeproj/project.pbxproj
      
      - name: Build
        run: |
          mkdir -p build
          
          # 列出所有 xcodeproj
          echo "Available projects:"
          ls *.xcodeproj
          
          # 尝试构建
          for proj in *.xcodeproj; do
            echo "Trying to build $proj..."
            xcodebuild build \
              -project "$proj" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              2>&1 | tail -50
          done
          
          echo "Build completed"
      
      - name: Create Dummy IPA
        run: |
          echo "Creating test IPA..."
          mkdir -p Payload
          mkdir -p Payload/TestApp.app
          echo "Mock" > Payload/TestApp.app/Info.plist
          zip -r TestApp.ipa Payload
          rm -rf Payload
          ls -la TestApp.ipa
          echo "Test IPA created"
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test-ipa
          path: TestApp.ipa
          retention-days: 7
