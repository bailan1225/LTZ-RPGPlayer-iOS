name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Dependencies
        run: npm install
      
      - name: Add iOS Platform
        run: npx cap add ios
      
      - name: Sync iOS
        run: npx cap sync ios
      
      - name: Build Archive
        run: |
          cd ios/App
          echo "Building archive..."
          xcodebuild archive             -workspace App.xcworkspace             -scheme App             -configuration Release             -destination 'generic/platform=iOS'             -archivePath build/App.xcarchive             CODE_SIGNING_ALLOWED=YES             CODE_SIGNING_REQUIRED=NO             DEVELOPMENT_TEAM=""             PROVISIONING_PROFILE_SPECIFIER=""             2>&1 | tee build.log
          echo "Archive exit: $?"
      
      - name: Create IPA
        run: |
          cd ios/App
          if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            mkdir -p Payload
            cp -R build/App.xcarchive/Products/Applications/App.app Payload/
            zip -r ../../ltz-rpg.ipa Payload
            rm -rf Payload
            ls -la ../../ltz-rpg.ipa
            echo "IPA created: $(du -sh ../../ltz-rpg.ipa | cut -f1)"
          else
            echo "Error: Archive not found"
            ls -la build/
            exit 1
          fi
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LTZ-RPG-IPA
          path: ltz-rpg.ipa
          retention-days: 7
