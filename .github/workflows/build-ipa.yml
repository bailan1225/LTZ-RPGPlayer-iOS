name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Check Environment
        run: |
          echo "=== System Info ==="
          uname -a
          echo ""
          echo "=== Xcode ==="
          xcodebuild -version
          echo ""
          echo "=== Swift ==="
          swift --version
          echo ""
          echo "=== Files ==="
          find . -type f | sort
          echo ""
          echo "=== Project Files ==="
          ls -la *.xcodeproj 2>/dev/null || echo "No xcodeproj found"
          ls -la *.xcworkspace 2>/dev/null || echo "No xcworkspace found"
      
      - name: Create Dummy IPA
        run: |
          echo "Creating dummy IPA..."
          mkdir -p Payload
          # 创建一个简单的目录结构作为测试
          mkdir -p Payload/DummyApp.app
          echo "test" > Payload/DummyApp.app/Info.plist
          zip -qr DummyApp.ipa Payload
          rm -rf Payload
          ls -la DummyApp.ipa
          echo "Dummy IPA created successfully"
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test-ipa
          path: DummyApp.ipa
