name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Check Environment
        run: |
          echo "=== System Info ==="
          uname -a
          echo ""
          echo "=== Xcode Version ==="
          xcodebuild -version 2>/dev/null || echo "Xcode not found"
          echo ""
          echo "=== Swift Version ==="
          swift --version 2>/dev/null || echo "Swift not found"
          echo ""
          echo "=== Available Xcode Versions ==="
          ls /Applications/ | grep -i xcode || echo "No Xcode found"
          echo ""
          echo "=== Current Directory ==="
          pwd
          ls -la
          echo ""
          echo "=== Swift Files ==="
          find . -name "*.swift"
          echo ""
          echo "=== Xcode Projects ==="
          find . -name "*.xcodeproj"
      
      - name: Create Test IPA
        run: |
          echo "Creating test IPA..."
          mkdir -p build/Payload
          # Create a dummy app bundle
          mkdir -p build/Payload/TestApp.app
          echo "Mock IPA created"
          ls -la build/Payload/
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: build/
