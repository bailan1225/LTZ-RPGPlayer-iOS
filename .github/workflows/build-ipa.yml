name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: |
          echo "Available Xcode versions:"
          ls /Applications/ | grep -i xcode
          sudo xcode-select -switch /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -switch /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version
          swift --version
      
      - name: Check Project
        run: |
          echo "=== Project Structure ==="
          ls -la
          echo ""
          echo "=== Swift Files ==="
          find . -name "*.swift"
          echo ""
          echo "=== Xcode Project ==="
          ls *.xcodeproj
          echo ""
          echo "=== Scheme ==="
          ls MyApp.xcodeproj/xcshareddata/xcschemes/
      
      - name: Build Archive
        run: |
          echo "Starting archive build..."
          mkdir -p build
          
          xcodebuild archive \
            -project MyApp.xcodeproj \
            -scheme MyApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/MyApp.xcarchive \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build.log
          
          echo "Build completed"
          
          if [ -d "build/MyApp.xcarchive" ]; then
            echo "Archive created successfully"
            ls -la build/MyApp.xcarchive/
          else
            echo "Error: Archive not found"
            exit 1
          fi
      
      - name: Create IPA
        run: |
          echo "Creating IPA..."
          if [ -d "build/MyApp.xcarchive/Products/Applications/MyApp.app" ]; then
            mkdir -p Payload
            cp -R build/MyApp.xcarchive/Products/Applications/MyApp.app Payload/
            zip -r MyApp.ipa Payload
            rm -rf Payload
            ls -la MyApp.ipa
            echo "IPA size: $(du -sh MyApp.ipa | cut -f1)"
          else
            echo "Error: App not found in archive"
            ls -la build/MyApp.xcarchive/Products/Applications/
            exit 1
          fi
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-ipa
          path: MyApp.ipa
          retention-days: 7
