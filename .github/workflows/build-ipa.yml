name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: |
          ls /Applications/ | grep -i xcode
          sudo xcode-select -switch /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -switch /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version
      
      - name: Check Project
        run: |
          echo "=== Files ==="
          find . -name "*.swift"
          echo ""
          echo "=== Xcode Project ==="
          ls *.xcodeproj
          echo ""
          echo "=== Scheme ==="
          ls LTZRPGPlayer.xcodeproj/xcshareddata/xcschemes/
      
      - name: Build Archive
        run: |
          mkdir -p build
          echo "Starting archive build..."
          
          xcodebuild archive \
            -project LTZRPGPlayer.xcodeproj \
            -scheme LTZRPGPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/LTZRPGPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log
          
          if [ -d "build/LTZRPGPlayer.xcarchive" ]; then
            echo "Archive created successfully"
          else
            echo "Error: Archive not found"
            cat build.log | tail -50
            exit 1
          fi
      
      - name: Create IPA
        run: |
          if [ -d "build/LTZRPGPlayer.xcarchive/Products/Applications/LTZRPGPlayer.app" ]; then
            mkdir -p Payload
            cp -R build/LTZRPGPlayer.xcarchive/Products/Applications/LTZRPGPlayer.app Payload/
            zip -r LTZRPGPlayer.ipa Payload
            rm -rf Payload
            ls -la LTZRPGPlayer.ipa
          else
            echo "Error: App not found"
            ls -la build/LTZRPGPlayer.xcarchive/Products/Applications/
            exit 1
          fi
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LTZRPGPlayer-ipa
          path: LTZRPGPlayer.ipa
          retention-days: 7
