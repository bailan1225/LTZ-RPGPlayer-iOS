name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: List Files
        run: |
          echo "=== Root ==="
          ls -la
          echo ""
          echo "=== Swift Files ==="
          find . -name "*.swift"
          echo ""
          echo "=== Xcode Project ==="
          ls *.xcodeproj
          echo ""
          echo "=== Xcode Version ==="
          xcodebuild -version 2>/dev/null || echo "Xcode not found"
      
      - name: Build
        run: |
          cd iOSApp.xcodeproj/.. 2>/dev/null || true
          echo "Current dir:"
          pwd
          ls -la
          echo ""
          echo "Attempting build..."
          xcodebuild build             -project iOSApp.xcodeproj             -scheme iOSApp             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             ONLY_ACTIVE_ARCH=YES || true
          echo "Build exit: $?"
      
      - name: Archive
        run: |
          echo "Attempting archive..."
          mkdir -p build
          xcodebuild archive             -project iOSApp.xcodeproj             -scheme iOSApp             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -archivePath build/iOSApp.xcarchive             CODE_SIGNING_ALLOWED=YES             CODE_SIGNING_REQUIRED=NO             DEVELOPMENT_TEAM="" || true
          echo "Archive exit: $?"
          ls -la build/ 2>/dev/null || true
