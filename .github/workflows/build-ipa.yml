name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: List Files
        run: |
          echo "=== Files ==="
          ls -la
          echo ""
          echo "=== Xcode Project ==="
          find . -name "*.xcodeproj"
          echo ""
          echo "=== Swift Files ==="
          find . -name "*.swift"
      
      - name: Select Xcode
        run: |
          echo "Available Xcode versions:"
          ls /Applications/ | grep -i xcode
          sudo xcode-select -switch /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -switch /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version
      
      - name: Build Archive
        run: |
          mkdir -p build
          echo "Starting archive build..."
          
          # 直接使用 project（没有 CocoaPods/Capacitor 依赖）
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log
          
          echo "Build exit: $?"
          
          if [ -d "build/App.xcarchive" ]; then
            echo "Archive created successfully"
            ls -la build/App.xcarchive/
          else
            echo "Error: Archive not found"
            cat build.log | tail -50
            exit 1
          fi
      
      - name: Create IPA
        run: |
          echo "Creating IPA..."
          
          if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            mkdir -p Payload
            cp -R build/App.xcarchive/Products/Applications/App.app Payload/
            zip -r App.ipa Payload
            rm -rf Payload
            ls -la App.ipa
            echo "IPA size: $(du -sh App.ipa | cut -f1)"
          else
            echo "Error: App not found"
            ls -la build/App.xcarchive/Products/Applications/
            exit 1
          fi
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-ipa
          path: App.ipa
          retention-days: 7
