name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: |
          ls /Applications/ | grep -i xcode
          sudo xcode-select -switch /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -switch /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version
          swift --version
      
      - name: Check Project
        run: |
          echo "=== Files ==="
          find . -name "*.swift"
          echo ""
          echo "=== Xcode Project ==="
          ls *.xcodeproj
          echo ""
          echo "=== Scheme ==="
          ls SimpleApp.xcodeproj/xcshareddata/xcschemes/
      
      - name: Build Archive
        run: |
          mkdir -p build
          xcodebuild archive \
            -project SimpleApp.xcodeproj \
            -scheme SimpleApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/SimpleApp.xcarchive \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log
          
          if [ -d "build/SimpleApp.xcarchive" ]; then
            echo "Archive created successfully"
          else
            echo "Error: Archive not found"
            exit 1
          fi
      
      - name: Create IPA
        run: |
          if [ -d "build/SimpleApp.xcarchive/Products/Applications/SimpleApp.app" ]; then
            mkdir -p Payload
            cp -R build/SimpleApp.xcarchive/Products/Applications/SimpleApp.app Payload/
            zip -r SimpleApp.ipa Payload
            rm -rf Payload
            ls -la SimpleApp.ipa
            echo "IPA size: $(du -sh SimpleApp.ipa | cut -f1)"
          else
            echo "Error: App not found"
            ls -la build/SimpleApp.xcarchive/Products/Applications/
            exit 1
          fi
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SimpleApp-ipa
          path: SimpleApp.ipa
          retention-days: 7
