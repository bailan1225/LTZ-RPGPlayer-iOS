name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install xcodegen
        run: |
          brew install xcodegen
          xcodegen --version
      
      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la *.xcodeproj
          ls MyRPG.xcodeproj/xcshareddata/xcschemes/
      
      - name: Select Xcode
        run: |
          ls /Applications/ | grep -i xcode
          sudo xcode-select -switch /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -switch /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version
      
      - name: Build Archive
        run: |
          mkdir -p build
          echo "Starting archive build..."
          
          xcodebuild archive \
            -project MyRPG.xcodeproj \
            -scheme MyRPG \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/MyRPG.xcarchive \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build.log
          
          if [ -d "build/MyRPG.xcarchive" ]; then
            echo "Archive created successfully"
            ls -la build/MyRPG.xcarchive/
          else
            echo "Error: Archive not found"
            cat build.log
            exit 1
          fi
      
      - name: Create IPA
        run: |
          echo "Creating IPA..."
          
          if [ -d "build/MyRPG.xcarchive/Products/Applications/MyRPG.app" ]; then
            mkdir -p Payload
            cp -R build/MyRPG.xcarchive/Products/Applications/MyRPG.app Payload/
            zip -r MyRPG.ipa Payload
            rm -rf Payload
            ls -la MyRPG.ipa
            echo "IPA size: $(du -sh MyRPG.ipa | cut -f1)"
          else
            echo "Error: App not found in archive"
            ls -la build/MyRPG.xcarchive/Products/Applications/
            exit 1
          fi
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyRPG-ipa
          path: MyRPG.ipa
          retention-days: 7
