name: RPGTranslate
options:
  bundleIdPrefix: com.rpgtranslate
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  RPGTranslate:
    type: application
    platform: iOS
    sources:
      - path: RPGTranslate
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rpgtranslate.ios
        PRODUCT_NAME: RPGTranslate
        INFOPLIST_FILE: RPGTranslate/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
schemes:
  RPGTranslate:
    build:
      targets:
        RPGTranslate: all
    run:
      config: Debug
    archive:
      config: Release
