name: MyRPG
options:
  bundleIdPrefix: com.ltz
  deploymentTarget:
    iOS: "16.0"
targets:
  MyRPG:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: MyRPG
        CFBundleIdentifier: com.ltz.myrpg
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: Sources/AppDelegate.swift
        type: source
      - path: Sources/Assets.xcassets
        type: folder
